services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
  mongo:
    restart: unless-stopped
    image: mongo:7
    command: [mongod, --auth]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Run node docker/secure-mongo.mjs first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Mongo recovery credentials required}
      MONGO_APP_USER: ${MONGO_APP_USER:?Mongo application user required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Mongo application password required}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-caseflow.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  ai:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      CLASSIFIER_VARIANT: word
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Run npm run docker:up to generate internal credentials}
    volumes:
      - model-data:/app/model-store
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting compose}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Internal AI credentials required}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-10000}
      AI_FALLBACK_KEYWORDS: ${AI_FALLBACK_KEYWORDS:-}
      WEB_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: '1'
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-http://localhost:8080/api/auth/microsoft/callback}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-common}
      AUTO_SEED: ${AUTO_SEED:-false}
      UPLOAD_DIR: /app/uploads
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://object-storage:8333
      S3_BUCKET: caseflow-files
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run npm run docker:up to generate credentials}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run npm run docker:up to generate credentials}
      MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      clamav:
        condition: service_healthy
  object-storage:
    image: chrislusf/seaweedfs:4.38
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      S3_BUCKET: caseflow-files
    command: [mini, '-dir=/data']
    volumes:
      - object-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 30
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 40
volumes:
  mongo-data:
  upload-data:
  object-data:
  clamav-data:
  model-data:
